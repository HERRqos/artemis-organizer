[project]
name = "assistant-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["redis>=5.0", "httpx>=0.27"]

[project.optional-dependencies]
# Only the engine and reminder need Google; the webhook image stays slim.
calendar = ["google-api-python-client>=2.150", "google-auth>=2.35"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
